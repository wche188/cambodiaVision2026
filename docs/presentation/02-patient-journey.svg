<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <rect width="1200" height="760" fill="#f8fafc"/>
  <rect x="0" y="0" width="1200" height="90" fill="#0f766e"/>
  <text x="60" y="45" fill="white" font-size="28" font-weight="700">Cambodia Vision 2026</text>
  <text x="60" y="72" fill="#a7f3d0" font-size="16">Patient Journey — Registration to Discharge</text>
  <text x="1140" y="55" fill="white" font-size="14" text-anchor="end" font-weight="500">PATIENT FLOW</text>

  <!-- Legend -->
  <g transform="translate(60,115)">
    <text x="0" y="0" fill="#0f766e" font-size="13" font-weight="700">Legend</text>
    <rect x="60" y="-12" width="14" height="14" rx="3" fill="#dbeafe"/>
    <text x="82" y="0" fill="#374151" font-size="11">Volunteer action</text>
    <rect x="195" y="-12" width="14" height="14" rx="3" fill="#fef3c7"/>
    <text x="217" y="0" fill="#374151" font-size="11">Station manager action</text>
    <rect x="365" y="-12" width="14" height="14" rx="3" fill="#d1fae5"/>
    <text x="387" y="0" fill="#374151" font-size="11">Patient status</text>
    <rect x="495" y="-12" width="14" height="14" rx="3" fill="#fce7f3"/>
    <text x="517" y="0" fill="#374151" font-size="11">Surgery stage</text>
  </g>

  <!-- STAGE 1 -->
  <g transform="translate(60,145)">
    <rect width="1080" height="80" rx="12" fill="white" stroke="#e5e7eb"/>
    <text x="20" y="25" fill="#0f766e" font-size="13" font-weight="700">STAGE 1 — ARRIVAL &amp; REGISTRATION</text>

    <g transform="translate(20,40)">
      <rect width="200" height="32" rx="6" fill="#dbeafe"/>
      <text x="100" y="21" fill="#1e3a8a" font-size="12" text-anchor="middle" font-weight="600">Patient arrives + queue</text>
    </g>
    <g transform="translate(240,40)">
      <rect width="240" height="32" rx="6" fill="#dbeafe"/>
      <text x="120" y="21" fill="#1e3a8a" font-size="12" text-anchor="middle" font-weight="600">Volunteer registers (15-field form)</text>
    </g>
    <g transform="translate(500,40)">
      <rect width="240" height="32" rx="6" fill="#d1fae5"/>
      <text x="120" y="21" fill="#065f46" font-size="12" text-anchor="middle" font-weight="600">4-digit # assigned → Registered</text>
    </g>
    <g transform="translate(760,40)">
      <rect width="300" height="32" rx="6" fill="#dbeafe"/>
      <text x="150" y="21" fill="#1e3a8a" font-size="12" text-anchor="middle" font-weight="600">Download registration form (PDF)</text>
    </g>

    <polygon points="220,56 240,56 240,52 250,61 240,70 240,66 220,66" fill="#0f766e"/>
    <polygon points="480,56 500,56 500,52 510,61 500,70 500,66 480,66" fill="#0f766e"/>
    <polygon points="740,56 760,56 760,52 770,61 760,70 760,66 740,66" fill="#0f766e"/>
  </g>

  <!-- Down arrow -->
  <polygon points="595,235 605,235 605,250 615,250 600,265 585,250 595,250" fill="#0f766e"/>

  <!-- STAGE 2 -->
  <g transform="translate(60,275)">
    <rect width="1080" height="120" rx="12" fill="white" stroke="#e5e7eb"/>
    <text x="20" y="25" fill="#0f766e" font-size="13" font-weight="700">STAGE 2 — GP EXAMINATION</text>

    <g transform="translate(20,40)">
      <rect width="220" height="32" rx="6" fill="#fef3c7"/>
      <text x="110" y="21" fill="#92400e" font-size="12" text-anchor="middle" font-weight="600">Scan QR / enter # at station</text>
    </g>
    <g transform="translate(260,40)">
      <rect width="220" height="32" rx="6" fill="#fef3c7"/>
      <text x="110" y="21" fill="#92400e" font-size="12" text-anchor="middle" font-weight="600">GP records acuity + diagnosis</text>
    </g>
    <g transform="translate(500,40)">
      <rect width="220" height="32" rx="6" fill="#d1fae5"/>
      <text x="110" y="21" fill="#065f46" font-size="12" text-anchor="middle" font-weight="600">Status → Seen_by_GP</text>
    </g>
    <g transform="translate(740,40)">
      <rect width="320" height="32" rx="6" fill="#fef3c7"/>
      <text x="160" y="21" fill="#92400e" font-size="12" text-anchor="middle" font-weight="600">GP decides: Surgery_Eligible / Not_Eligible</text>
    </g>

    <!-- Soft warning note -->
    <g transform="translate(20,90)">
      <rect width="1040" height="22" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
      <text x="15" y="16" fill="#991b1b" font-size="11" font-weight="700">⚠</text>
      <text x="32" y="16" fill="#374151" font-size="11">Soft warning only — if Surgery is recorded without Doctor/Optometry, system shows an amber note. Medical judgment preserved.</text>
    </g>

    <polygon points="240,56 260,56 260,52 270,61 260,70 260,66 240,66" fill="#0f766e"/>
    <polygon points="480,56 500,56 500,52 510,61 500,70 500,66 480,66" fill="#0f766e"/>
    <polygon points="720,56 740,56 740,52 750,61 740,70 740,66 720,66" fill="#0f766e"/>
  </g>

  <!-- Down arrow -->
  <polygon points="595,405 605,405 605,420 615,420 600,435 585,420 595,420" fill="#0f766e"/>

  <!-- STAGE 3: Stations -->
  <g transform="translate(60,445)">
    <rect width="1080" height="150" rx="12" fill="white" stroke="#e5e7eb"/>
    <text x="20" y="25" fill="#0f766e" font-size="13" font-weight="700">STAGE 3 — STATIONS (any order, soft warnings only)</text>

    <g transform="translate(20,42)">
      <rect width="245" height="90" rx="8" fill="#fef3c7" stroke="#fbbf24"/>
      <text x="122" y="22" fill="#92400e" font-size="13" text-anchor="middle" font-weight="700">👨‍⚕️ Doctor</text>
      <text x="122" y="42" fill="#374151" font-size="11" text-anchor="middle">Triage + primary exam</text>
      <text x="122" y="62" fill="#6b7280" font-size="10" text-anchor="middle">Notes recorded</text>
      <text x="122" y="80" fill="#6b7280" font-size="10" text-anchor="middle" font-style="italic">stations_visited += Doctor</text>
    </g>
    <g transform="translate(285,42)">
      <rect width="245" height="90" rx="8" fill="#fef3c7" stroke="#fbbf24"/>
      <text x="122" y="22" fill="#92400e" font-size="13" text-anchor="middle" font-weight="700">👁 Optometry</text>
      <text x="122" y="42" fill="#374151" font-size="11" text-anchor="middle">Eye exam, refraction</text>
      <text x="122" y="62" fill="#6b7280" font-size="10" text-anchor="middle">Prescription recorded</text>
      <text x="122" y="80" fill="#6b7280" font-size="10" text-anchor="middle" font-style="italic">stations_visited += Optometry</text>
    </g>
    <g transform="translate(550,42)">
      <rect width="245" height="90" rx="8" fill="#fef3c7" stroke="#fbbf24"/>
      <text x="122" y="22" fill="#92400e" font-size="13" text-anchor="middle" font-weight="700">🔬 Refraction</text>
      <text x="122" y="42" fill="#374151" font-size="11" text-anchor="middle">Detailed refraction</text>
      <text x="122" y="62" fill="#6b7280" font-size="10" text-anchor="middle">Required before glasses</text>
      <text x="122" y="80" fill="#6b7280" font-size="10" text-anchor="middle" font-style="italic">stations_visited += Refraction</text>
    </g>
    <g transform="translate(815,42)">
      <rect width="245" height="90" rx="8" fill="#fef3c7" stroke="#fbbf24"/>
      <text x="122" y="22" fill="#92400e" font-size="13" text-anchor="middle" font-weight="700">👓 Glasses Dispensed</text>
      <text x="122" y="42" fill="#374151" font-size="11" text-anchor="middle">Hand-off to patient</text>
      <text x="122" y="62" fill="#6b7280" font-size="10" text-anchor="middle">Soft warning if no refraction</text>
      <text x="122" y="80" fill="#6b7280" font-size="10" text-anchor="middle" font-style="italic">stations_visited += Glasses</text>
    </g>
  </g>

  <!-- Down arrow -->
  <polygon points="595,605 605,605 605,620 615,620 600,635 585,620 595,620" fill="#0f766e"/>

  <!-- STAGE 4: Surgery + Discharge -->
  <g transform="translate(60,645)">
    <rect width="1080" height="100" rx="12" fill="white" stroke="#e5e7eb"/>
    <text x="20" y="25" fill="#0f766e" font-size="13" font-weight="700">STAGE 4 — SURGERY &amp; DISCHARGE</text>

    <g transform="translate(20,40)">
      <rect width="240" height="48" rx="6" fill="#fce7f3" stroke="#f472b6"/>
      <text x="120" y="22" fill="#831843" font-size="13" text-anchor="middle" font-weight="700">🏥 Surgery</text>
      <text x="120" y="40" fill="#374151" font-size="11" text-anchor="middle">Record procedure, IOL, surgeon</text>
    </g>
    <g transform="translate(280,40)">
      <rect width="240" height="48" rx="6" fill="#d1fae5"/>
      <text x="120" y="22" fill="#065f46" font-size="13" text-anchor="middle" font-weight="700">Status → Surgery_Completed</text>
      <text x="120" y="40" fill="#374151" font-size="11" text-anchor="middle">DOCX surgery form generated</text>
    </g>
    <g transform="translate(540,40)">
      <rect width="240" height="48" rx="6" fill="#d1fae5"/>
      <text x="120" y="22" fill="#065f46" font-size="13" text-anchor="middle" font-weight="700">Status → Complete</text>
      <text x="120" y="40" fill="#374151" font-size="11" text-anchor="middle">Patient ready to leave</text>
    </g>
    <g transform="translate(800,40)">
      <rect width="260" height="48" rx="6" fill="#d1fae5"/>
      <text x="130" y="22" fill="#065f46" font-size="13" text-anchor="middle" font-weight="700">📊 Updated in dashboard + report</text>
      <text x="130" y="40" fill="#374151" font-size="11" text-anchor="middle">Real-time counts + 14-day chart</text>
    </g>

    <polygon points="260,64 280,64 280,60 290,69 280,78 280,74 260,74" fill="#0f766e"/>
    <polygon points="520,64 540,64 540,60 550,69 540,78 540,74 520,74" fill="#0f766e"/>
    <polygon points="780,64 800,64 800,60 810,69 800,78 800,74 780,74" fill="#0f766e"/>
  </g>
</svg>