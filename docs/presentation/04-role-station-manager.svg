<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <rect width="1000" height="700" fill="#f8fafc"/>
  <rect x="0" y="0" width="1000" height="100" fill="#2563eb"/>
  <text x="40" y="48" fill="white" font-size="32" font-weight="700">🔬 Station Manager</text>
  <text x="40" y="78" fill="#bfdbfe" font-size="16">Runs ONE station — scans patients, records exams, advances care</text>
  <text x="960" y="55" fill="white" font-size="13" text-anchor="end" font-weight="600">ROLE PROFILE</text>

  <g transform="translate(40,135)">
    <rect width="450" height="100" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/>
    <text x="20" y="30" fill="#1e3a8a" font-size="14" font-weight="700">Who &amp; where</text>
    <text x="20" y="55" fill="#374151" font-size="13">• The clinician or assistant at one station</text>
    <text x="20" y="73" fill="#374151" font-size="13">• 1 per physical station: Doctor, Optometry,</text>
    <text x="20" y="91" fill="#374151" font-size="13">  Refraction, Glasses, Ear, Surgery</text>
  </g>

  <g transform="translate(510,135)">
    <rect width="450" height="100" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/>
    <text x="20" y="30" fill="#1e3a8a" font-size="14" font-weight="700">Login</text>
    <text x="20" y="55" fill="#374151" font-size="13">• Username + password</text>
    <text x="20" y="73" fill="#374151" font-size="13">• 1 login per station manager</text>
    <text x="20" y="91" fill="#374151" font-size="13">• Same login form as admin (type=admin)</text>
  </g>

  <g transform="translate(40,260)">
    <rect width="920" height="280" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/>
    <text x="20" y="32" fill="#1e3a8a" font-size="16" font-weight="700">What station managers can do</text>

    <g transform="translate(20,55)">
      <rect width="280" height="55" rx="6" fill="#dbeafe"/>
      <text x="14" y="20" fill="#1e3a8a" font-size="13" font-weight="700">Scan QR / lookup patient</text>
      <text x="14" y="38" fill="#374151" font-size="11">Camera scan or manual entry</text>
      <text x="14" y="52" fill="#374151" font-size="11">Idempotent — won't double-add</text>
    </g>

    <g transform="translate(320,55)">
      <rect width="280" height="55" rx="6" fill="#dbeafe"/>
      <text x="14" y="20" fill="#1e3a8a" font-size="13" font-weight="700">Record station visit</text>
      <text x="14" y="38" fill="#374151" font-size="11">Adds station to patient's</text>
      <text x="14" y="52" fill="#374151" font-size="11">stations_visited (no removal)</text>
    </g>

    <g transform="translate(620,55)">
      <rect width="280" height="55" rx="6" fill="#dbeafe"/>
      <text x="14" y="20" fill="#1e3a8a" font-size="13" font-weight="700">Mark form as printed</text>
      <text x="14" y="38" fill="#374151" font-size="11">After downloading registration</text>
      <text x="14" y="52" fill="#374151" font-size="11">form PDF for the patient</text>
    </g>

    <g transform="translate(20,125)">
      <rect width="280" height="55" rx="6" fill="#dbeafe"/>
      <text x="14" y="20" fill="#1e3a8a" font-size="13" font-weight="700">GP exam entry</text>
      <text x="14" y="38" fill="#374151" font-size="11">Visual acuity, diagnosis notes,</text>
      <text x="14" y="52" fill="#374151" font-size="11">recommendation</text>
    </g>

    <g transform="translate(320,125)">
      <rect width="280" height="55" rx="6" fill="#dbeafe"/>
      <text x="14" y="20" fill="#1e3a8a" font-size="13" font-weight="700">Surgery decision + record</text>
      <text x="14" y="38" fill="#374151" font-size="11">Eligibility, procedure, IOL,</text>
      <text x="14" y="52" fill="#374151" font-size="11">incision, surgeon notes</text>
    </g>

    <g transform="translate(620,125)">
      <rect width="280" height="55" rx="6" fill="#dbeafe"/>
      <text x="14" y="20" fill="#1e3a8a" font-size="13" font-weight="700">Station busy level</text>
      <text x="14" y="38" fill="#374151" font-size="11">Set Low/Mid/High to signal</text>
      <text x="14" y="52" fill="#374151" font-size="11">wait time to volunteers</text>
    </g>

    <g transform="translate(20,195)">
      <rect width="880" height="55" rx="6" fill="#fef3c7" stroke="#fbbf24"/>
      <text x="14" y="22" fill="#92400e" font-size="13" font-weight="700">Read access</text>
      <text x="14" y="40" fill="#374151" font-size="11">Sees patient list + full PHI (incl. gp_exam + surgery decisions). Cannot create users, change passphrase, or trigger backup.</text>
    </g>
  </g>

  <g transform="translate(40,565)">
    <rect width="920" height="100" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/>
    <text x="20" y="30" fill="#1e3a8a" font-size="14" font-weight="700">Typical station manager workflow</text>
    <text x="20" y="55" fill="#374151" font-size="12">1. Patient walks up → scan QR code or enter their 4-digit number</text>
    <text x="20" y="73" fill="#374151" font-size="12">2. App shows their record → record visit / exam / surgery decision</text>
    <text x="20" y="91" fill="#374151" font-size="12">3. Patient moves to next station → repeat</text>
  </g>
</svg>